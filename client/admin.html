<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<title>Espace pro — Paule Ackerman</title>
<link rel="icon" href="/media/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400..800;1,400..600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css">
<script>
/* Thème mémorisé appliqué avant le premier rendu (sinon : celui du système) */
try { var t = localStorage.getItem("adm-theme"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
/* =====================================================================
   Système visuel de l'espace pro
   Surfaces neutres, filets fins, un seul accent (le bleu de Paule),
   densité d'outil de travail. Clair et sombre, chacun calibré.
===================================================================== */
:root{
  color-scheme:light;
  --bg:#F3F4F7; --surface:#FFFFFF; --surface-2:#F5F6F9; --surface-3:#ECEEF3;
  --hover:rgba(14,17,22,.045); --press:rgba(14,17,22,.08);
  --line:rgba(14,17,22,.09); --line-2:rgba(14,17,22,.15);
  --ink:#0E1116; --ink-2:#5A6173; --ink-3:#8B91A1;
  --accent:#2D6AE0; --accent-h:#2459c4; --accent-soft:rgba(45,106,224,.10); --accent-line:rgba(45,106,224,.32); --on-accent:#fff;
  --ok:#1FA86A; --ok-soft:rgba(31,168,106,.12); --ok-ink:#006300;
  --warn:#C98500; --warn-soft:rgba(237,161,0,.14);
  --bad:#D03B3B; --bad-soft:rgba(208,59,59,.10);
  --wa:#1A8D4B;
  --series-1:#2D6AE0; --series-2:#eb6834; --series-hl:#1c5cab;
  --grid:#E7E9EE; --axis:#C9CDD6;
  --shadow-1:0 1px 2px rgba(14,17,22,.05);
  --shadow-2:0 1px 2px rgba(14,17,22,.04),0 10px 30px rgba(14,17,22,.07);
  --shadow-3:0 30px 80px rgba(14,17,22,.22);
  --r:14px; --r-sm:10px; --r-xs:8px;
  --sb:264px;
  --ui:'Schibsted Grotesk',system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:'Instrument Serif',Georgia,serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --g-nadia:linear-gradient(135deg,#2D6AE0,#7FA8F5);
  --g-yann:linear-gradient(135deg,#E2683A,#F2A65A);
  --g-awa:linear-gradient(135deg,#1A8D4B,#5CC98C);
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --bg:#0B0E15; --surface:#141924; --surface-2:#191F2C; --surface-3:#212838;
    --hover:rgba(232,234,242,.05); --press:rgba(232,234,242,.09);
    --line:rgba(232,234,242,.08); --line-2:rgba(232,234,242,.15);
    --ink:#E8EAF2; --ink-2:#A3ABC0; --ink-3:#6E7588;
    --accent:#4D86F2; --accent-h:#6E9BF5; --accent-soft:rgba(77,134,242,.16); --accent-line:rgba(77,134,242,.4);
    --ok:#2FBF7C; --ok-soft:rgba(47,191,124,.14); --ok-ink:#0ca30c;
    --warn:#E0A43B; --warn-soft:rgba(224,164,59,.16);
    --bad:#F0605D; --bad-soft:rgba(240,96,93,.14);
    --series-1:#4D86F2; --series-2:#d95926; --series-hl:#86b6ef;
    --grid:#222937; --axis:#323B4D;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 1px 2px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.35);
    --shadow-3:0 30px 90px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B0E15; --surface:#141924; --surface-2:#191F2C; --surface-3:#212838;
  --hover:rgba(232,234,242,.05); --press:rgba(232,234,242,.09);
  --line:rgba(232,234,242,.08); --line-2:rgba(232,234,242,.15);
  --ink:#E8EAF2; --ink-2:#A3ABC0; --ink-3:#6E7588;
  --accent:#4D86F2; --accent-h:#6E9BF5; --accent-soft:rgba(77,134,242,.16); --accent-line:rgba(77,134,242,.4);
  --ok:#2FBF7C; --ok-soft:rgba(47,191,124,.14); --ok-ink:#0ca30c;
  --warn:#E0A43B; --warn-soft:rgba(224,164,59,.16);
  --bad:#F0605D; --bad-soft:rgba(240,96,93,.14);
  --series-1:#4D86F2; --series-2:#d95926; --series-hl:#86b6ef;
  --grid:#222937; --axis:#323B4D;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 1px 2px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.35);
  --shadow-3:0 30px 90px rgba(0,0,0,.6);
}

/* ---------- Base ---------- */
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--ui);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
[hidden]{display:none!important}
::selection{background:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.ph-duotone{line-height:1;flex:0 0 auto}
input,textarea,select{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:9px 12px;width:100%;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:80px;line-height:1.55}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);padding:0}
label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin:14px 0 6px}
label .help{font-weight:400;color:var(--ink-3)}
kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--ink-3);background:var(--surface)}
.mono{font-family:var(--mono)}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.spin{width:15px;height:15px;border:2px solid var(--line-2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;flex:0 0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes monte{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- Boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:var(--r-sm);font-weight:600;font-size:13.5px;
  background:var(--surface);color:var(--ink);border:1px solid var(--line-2);box-shadow:var(--shadow-1);transition:background .15s,border-color .15s,transform .1s;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn .ph-duotone{font-size:17px}
.btn.primary,.btn:not(.ghost):not(.soft):not(.danger):not(.wa):not(.plain).bleu{background:var(--accent);border-color:transparent;color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-h)}
.btn.soft{background:var(--accent-soft);color:var(--accent);border-color:transparent;box-shadow:none}
.btn.soft:hover{background:var(--accent-line)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--hover);color:var(--ink)}
.btn.danger{color:var(--bad);border-color:var(--line-2)}
.btn.danger:hover{background:var(--bad-soft)}
.btn.wa{background:var(--wa);border-color:transparent;color:#fff}
.btn.wa:hover{filter:brightness(1.08)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:var(--r-xs)}
.btn.lg{height:44px;padding:0 18px;font-size:14.5px}
.btn.ico{width:36px;padding:0}.btn.sm.ico{width:30px}
.btn:disabled{opacity:.55;cursor:default;transform:none}
.icobtn{width:32px;height:32px;border-radius:var(--r-xs);display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2);transition:background .15s,color .15s}
.icobtn:hover{background:var(--hover);color:var(--ink)}
.icobtn .ph-duotone{font-size:18px}
.icobtn.danger:hover{background:var(--bad-soft);color:var(--bad)}

/* ---------- Pastilles ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--surface-3);color:var(--ink-2);white-space:nowrap;line-height:1.6}
.pill .ph-duotone{font-size:13px}
.pill.bleu{background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.chaud{background:var(--warn-soft);color:var(--warn)}
.pill.ko{background:var(--bad-soft);color:var(--bad)}
.pill.contour{background:transparent;border:1px solid var(--line-2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);display:inline-block;flex:0 0 auto}
.dot.ok{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.dot.ko{background:var(--bad)}
.dot.bleu{background:var(--accent)}

/* ---------- Avatars ---------- */
.av{width:36px;height:36px;border-radius:50%;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;
  background:var(--surface-3) center/cover no-repeat;position:relative}
.av.sm{width:28px;height:28px;font-size:12px}.av.lg{width:48px;height:48px;font-size:18px}.av.xl{width:72px;height:72px;font-size:26px}
.av.initiale{background:var(--surface-3);color:var(--ink-2)}
.av.nadia{background:var(--g-nadia)}.av.yann{background:var(--g-yann)}.av.awa{background:var(--g-awa)}
.av .etat{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:var(--ok);border:2px solid var(--surface)}
.av .etat.off{background:var(--ink-3)}

/* =====================================================================
   Connexion
===================================================================== */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(1200px 600px at 50% -10%,var(--accent-soft),transparent),var(--bg)}
.login-card{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:34px 30px 26px;box-shadow:var(--shadow-2);text-align:center;animation:monte .35s ease}
.login-av{width:76px;height:76px;border-radius:50%;margin:0 auto 14px;padding:3px;background:linear-gradient(45deg,#141A2A,#2D6AE0 55%,#7FA8F5)}
.login-av div{width:100%;height:100%;border-radius:50%;border:3px solid var(--surface);background:#141A2A url(/media/asset-01-90d3c5eb78.jpg) center/cover}
.login-card h1{font-size:22px;font-weight:700;letter-spacing:-.02em}
.login-card p{color:var(--ink-2);font-size:13.5px;margin:6px 0 10px}
.login-card label{text-align:left}
.login-card .btn{width:100%;margin-top:14px}
.login .err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px;text-align:left}
.login-site{display:inline-block;margin-top:16px;font-size:12.5px;color:var(--ink-3)}
.login-site:hover{color:var(--ink)}

/* =====================================================================
   Ossature de l'application
===================================================================== */
.app{display:flex;min-height:100vh}
.sb{position:fixed;inset:0 auto 0 0;width:var(--sb);background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40}
.sb-top{padding:16px 14px 10px}
.sb-brand{display:flex;align-items:center;gap:11px;padding:4px 6px 14px}
.sb-logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#141A2A,#2D6AE0);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-style:italic;font-size:16px;flex:0 0 auto}
.sb-brand b{display:block;font-size:14.5px;letter-spacing:-.01em}
.sb-brand small{display:block;font-size:11.5px;color:var(--ink-3)}
.sb-search{width:100%;display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--line);color:var(--ink-3);font-size:13px;transition:border-color .15s}
.sb-search:hover{border-color:var(--line-2);color:var(--ink-2)}
.sb-search span{flex:1;text-align:left}
.sb-search .ph-duotone{font-size:16px}
.sb-nav{flex:1;overflow-y:auto;padding:6px 10px 10px;scrollbar-width:thin}
.sb-sec{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:14px 10px 6px}
.sb-it{width:100%;display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:var(--r-xs);color:var(--ink-2);font-weight:500;font-size:13.5px;transition:background .12s,color .12s;position:relative}
.sb-it:hover{background:var(--hover);color:var(--ink)}
.sb-it .ph-duotone{font-size:19px}
.sb-it.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.sb-it .n{margin-left:auto;font-size:11px;font-weight:700;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center}
.sb-it .n.chaud{background:var(--warn)}
.sb-team{border-top:1px solid var(--line);padding:10px 10px 8px}
.sb-team .sb-sec{padding:6px 10px 6px}
.sb-agent{width:100%;display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:var(--r-xs);text-align:left}
.sb-agent:hover{background:var(--hover)}
.sb-agent b{display:block;font-size:13px;font-weight:600}
.sb-agent small{display:block;font-size:11.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
.sb-foot{border-top:1px solid var(--line);padding:10px}
.sb-me{width:100%;display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:var(--r-xs);text-align:left}
.sb-me:hover{background:var(--hover)}
.sb-me b{display:block;font-size:13px}.sb-me small{display:block;font-size:11.5px;color:var(--ink-3)}
.sb-me .ph-duotone{margin-left:auto;color:var(--ink-3);font-size:16px}
.sb-voile{display:none}

.main{flex:1;min-width:0;margin-left:var(--sb);display:flex;flex-direction:column;min-height:100vh}
.tb{position:sticky;top:0;z-index:30;height:64px;display:flex;align-items:center;gap:12px;padding:0 28px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.tb-titre{flex:1;min-width:0}
.tb-titre h1{font-size:17px;font-weight:700;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-titre p{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-actions{display:flex;align-items:center;gap:6px}
.tb-ic{width:36px;height:36px;border-radius:var(--r-sm);display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2);position:relative}
.tb-ic:hover{background:var(--hover);color:var(--ink)}
.tb-ic .ph-duotone{font-size:20px}
.tb-ic .pastille{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--bad);border:2px solid var(--bg)}
.only-m{display:none}
.panel{flex:1;width:100%;max-width:1240px;margin:0 auto;padding:26px 28px 80px;animation:arrive .25s ease}
@keyframes arrive{from{transform:translateY(6px)}to{transform:none}}
.panel.plein{max-width:none;padding:0;height:calc(100vh - 64px);overflow:hidden}
.mnav{display:none}

/* ---------- En-têtes de vue (y compris éditeurs de contenu) ---------- */
.bar{display:flex;align-items:center;gap:10px;margin:0 0 18px;flex-wrap:wrap}
.bar h2{font-size:22px;font-weight:700;letter-spacing:-.02em;flex:1;min-width:200px}
.bar h2 small{display:block;font-size:13px;font-weight:400;color:var(--ink-3);letter-spacing:0}
.hint{font-size:13px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 14px;margin-bottom:16px;line-height:1.55;display:flex;gap:10px}
.hint .ph-duotone{font-size:18px;color:var(--accent);margin-top:1px}
.hint.ok{border-color:transparent;background:var(--ok-soft);color:var(--ink)}
.hint.alerte{border-color:transparent;background:var(--warn-soft);color:var(--ink)}
.empty{text-align:center;color:var(--ink-3);padding:48px 16px;font-size:14px}
.empty .ph-duotone{font-size:34px;display:block;margin:0 auto 10px;color:var(--ink-3)}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.toolbar .sp{flex:1}
.toolbar input[type=search]{width:auto;min-width:220px;height:36px;padding:0 12px}
.toolbar select{width:auto;height:36px;padding:0 10px}

/* ---------- Cartes & sections ---------- */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-1);margin-bottom:16px}
.sec-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.sec-h h3{font-size:14.5px;font-weight:700;letter-spacing:-.01em;flex:1;display:flex;align-items:center;gap:8px}
.sec-h h3 .ph-duotone{font-size:18px;color:var(--accent)}
.sec-h small{font-size:12.5px;color:var(--ink-3);font-weight:400}
.sec-b{padding:16px 18px}
.sec-b.flush{padding:0}
.grille{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-12{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.ligne{display:flex;align-items:center;gap:12px;padding:11px 18px;border-top:1px solid var(--line);font-size:13.5px;transition:background .12s}
.ligne:first-child{border-top:none}
.ligne.cliquable{cursor:pointer}
.ligne.cliquable:hover{background:var(--hover)}
.ligne .grow{flex:1;min-width:0}
.ligne .grow b{font-weight:600}
.ligne .grow small{display:block;color:var(--ink-3);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ligne .ico-rond{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);flex:0 0 auto}
.ligne .ico-rond .ph-duotone{font-size:18px}
.ligne .ico-rond.chaud{background:var(--warn-soft);color:var(--warn)}
.ligne .ico-rond.ko{background:var(--bad-soft);color:var(--bad)}
.ligne .ico-rond.ok{background:var(--ok-soft);color:var(--ok)}

/* ---------- Éditeurs de contenu (listes & formulaires) ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:8px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow-1);transition:border-color .15s}
.card:hover{border-color:var(--line-2)}
.card .thumb{width:52px;height:52px;border-radius:9px;object-fit:cover;background:var(--surface-3);flex:0 0 auto}
.card .thumb.txt{display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-style:italic;font-size:22px;color:var(--ink-3)}
.card .cbody{flex:1;min-width:0}
.card .ct{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .cs{font-size:12.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.card .acts{display:flex;gap:2px;flex:0 0 auto}
.badge{font-size:11px;font-weight:600;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 8px;margin-left:8px}
.form{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 22px 22px;margin-bottom:16px;box-shadow:var(--shadow-1)}
.form>b:first-child{display:block;font-size:15px;margin-top:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.check{display:flex;align-items:center;gap:9px;margin-top:16px;font-size:13.5px;font-weight:600;color:var(--ink)}
.media-field{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.media-field img,.media-field video{width:84px;height:84px;object-fit:cover;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface-3)}
.media-empty{width:84px;height:84px;border-radius:var(--r-sm);border:1.5px dashed var(--line-2);display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:22px}
.subrow{border:1px solid var(--line);border-radius:var(--r-sm);padding:2px 14px 14px;margin-bottom:10px;position:relative;background:var(--surface-2)}
.subrow .rm{position:absolute;top:8px;right:8px}
.formfoot{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;align-items:center}
.savemsg{font-size:13px;font-weight:600}
.savemsg.ok{color:var(--ok)}.savemsg.bad{color:var(--bad)}

/* =====================================================================
   Superpositions : modale, tiroir, palette, notifications, toasts
===================================================================== */
.voile{position:fixed;inset:0;z-index:90;background:rgba(10,14,24,.42);backdrop-filter:blur(3px);animation:fondu .18s ease}
@keyframes fondu{from{opacity:0}to{opacity:1}}
.modale{position:fixed;z-index:95;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 48px);overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-3);animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:translate(-50%,-48%) scale(.98)}to{opacity:1;transform:translate(-50%,-50%)}}
.modale-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modale-h h3{flex:1;font-size:16px;font-weight:700}
.modale-b{padding:4px 20px 20px}
.tiroir{position:fixed;z-index:95;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow-3);display:flex;flex-direction:column;animation:glisse .22s ease}
@keyframes glisse{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.tiroir-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.tiroir-h h3{flex:1;font-size:16px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tiroir-b{flex:1;overflow-y:auto;padding:4px 20px 28px}
.cmd{position:fixed;z-index:96;left:50%;top:12vh;transform:translateX(-50%);width:min(640px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-3);overflow:hidden;animation:fondu .15s ease}
.cmd-in{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line)}
.cmd-in .ph-duotone{font-size:20px;color:var(--ink-3)}
.cmd-in input{border:none;box-shadow:none;height:54px;font-size:16px;padding:0;background:transparent}
.cmd-l{max-height:min(420px,60vh);overflow-y:auto;padding:6px}
.cmd-g{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:10px 10px 4px}
.cmd-it{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:var(--r-xs);cursor:pointer}
.cmd-it .ph-duotone{font-size:18px;color:var(--ink-2)}
.cmd-it b{font-weight:600;font-size:13.5px}
.cmd-it small{display:block;font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmd-it .grow{flex:1;min-width:0}
.cmd-it.on{background:var(--accent-soft)}
.cmd-it.on .ph-duotone{color:var(--accent)}
.cmd-f{display:flex;gap:14px;padding:9px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3)}
.notifs{position:fixed;z-index:95;top:58px;right:20px;width:min(400px,calc(100vw - 24px));max-height:min(560px,calc(100vh - 80px));display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-3);animation:fondu .15s ease;overflow:hidden}
.notifs-h{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.notifs-h b{flex:1;font-size:15px}
.notifs-b{overflow-y:auto}
.notifs .ligne{padding:11px 16px}
.notifs .ligne.nouveau{background:var(--accent-soft)}
.toasts{position:fixed;z-index:120;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;min-width:240px;max-width:380px;background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:12px;box-shadow:var(--shadow-3);font-size:13.5px;animation:monte .2s ease}
.toast .ph-duotone{font-size:18px}
.toast.ko{background:var(--bad);color:#fff}

/* =====================================================================
   Accueil : héros façon profil social
===================================================================== */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow-1);margin-bottom:18px;text-align:center}
.hero-cover{height:150px;background:#141A2A center/cover no-repeat;position:relative}
.hero-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(10,14,24,.35))}
.hero-av{width:112px;height:112px;margin:-56px auto 0;position:relative;z-index:2;border-radius:50%;padding:3px;background:linear-gradient(45deg,#141A2A,#2D6AE0 55%,#7FA8F5)}
.hero-av div{width:100%;height:100%;border-radius:50%;border:4px solid var(--surface);background:#141A2A center/cover no-repeat}
.hero-av .enligne{position:absolute;right:8px;bottom:8px;width:18px;height:18px;border-radius:50%;background:var(--ok);border:3px solid var(--surface)}
.hero-nom{font-family:var(--serif);font-style:italic;font-weight:400;font-size:34px;letter-spacing:-.01em;margin-top:10px;display:inline-flex;align-items:center;gap:8px}
.verif{width:20px;height:20px;border-radius:50%;background:var(--accent);display:inline-flex;align-items:center;justify-content:center}
.verif svg{width:11px;height:11px;stroke:#fff;stroke-width:3;fill:none}
.hero-meta{color:var(--ink-2);font-size:13.5px;margin-top:2px}
.hero-salut{margin-top:6px;font-size:13px;color:var(--ink-3)}
.hero-stats{display:flex;justify-content:center;gap:0;margin:18px auto 0;max-width:640px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.hero-stat{flex:1;padding:14px 8px;text-align:center;border-left:1px solid var(--line);transition:background .12s}
.hero-stat:first-child{border-left:none}
.hero-stat:hover{background:var(--hover)}
.hero-stat b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em}
.hero-stat span{font-size:12px;color:var(--ink-3)}
.hero-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:16px 16px 20px}
.equipe-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}
.employe{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow-1);text-align:left;transition:border-color .15s,transform .15s}
.employe:hover{border-color:var(--accent-line);transform:translateY(-1px)}
.employe .haut{display:flex;align-items:center;gap:12px}
.employe .haut b{display:block;font-size:14.5px}
.employe .haut small{display:block;font-size:12px;color:var(--ink-3)}
.employe p{font-size:12.5px;color:var(--ink-2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:37px}
.employe .bas{display:flex;align-items:center;gap:8px}
.employe .bas .sp{flex:1}

/* ---------- Tuiles chiffrées ---------- */
.tuiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.tuile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow-1);text-align:left}
button.tuile{cursor:pointer;transition:border-color .15s}
button.tuile:hover{border-color:var(--accent-line)}
.tuile .lab{font-size:12.5px;color:var(--ink-2);font-weight:500}
.tuile .val{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:4px;line-height:1.15}
.tuile .delta{font-size:12px;font-weight:600;margin-top:4px;display:flex;align-items:center;gap:4px;color:var(--ink-3)}
.tuile .delta.up{color:var(--ok-ink)}.tuile .delta.down{color:var(--bad)}
.tuile .delta span{font-weight:400;color:var(--ink-3)}

/* =====================================================================
   Messagerie (boîte de réception en deux panneaux)
===================================================================== */
.inbox{display:grid;grid-template-columns:380px minmax(0,1fr);height:100%}
.inbox-l{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.inbox-f{padding:14px 14px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.segs{display:flex;gap:2px;background:var(--surface-3);border-radius:var(--r-sm);padding:3px}
.segs button{flex:1;border-radius:7px;padding:6px 8px;font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.segs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
.inbox-list{flex:1;overflow-y:auto}
.it{display:flex;gap:11px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;position:relative;transition:background .12s}
.it:hover{background:var(--hover)}
.it.on{background:var(--accent-soft)}
.it.nonlu::before{content:"";position:absolute;left:5px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--accent)}
.it .grow{flex:1;min-width:0}
.it .l1{display:flex;align-items:baseline;gap:8px}
.it .l1 b{flex:1;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it.nonlu .l1 b{font-weight:800}
.it .l1 time{font-size:11.5px;color:var(--ink-3);flex:0 0 auto}
.it .l2{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .l3{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.inbox-d{overflow-y:auto;min-height:0;background:var(--bg)}
.lecture{max-width:820px;margin:0 auto;padding:24px 28px 60px}
.lecture-h{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px}
.lecture-h .grow{flex:1;min-width:0}
.lecture-h h2{font-size:20px;font-weight:700;letter-spacing:-.02em}
.lecture-h .coord{font-size:13px;color:var(--ink-2);display:flex;gap:12px;flex-wrap:wrap;margin-top:2px}
.lecture-h .coord a:hover{color:var(--accent)}
.lecture-acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.qualif{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.qualif span{font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xs);padding:5px 10px}
.qualif b{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin-right:6px;font-weight:600}
.corps{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;font-size:14.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word;margin-bottom:16px;box-shadow:var(--shadow-1)}
.retour-m{display:none}

/* ---------- Analyse IA ---------- */
.diag{border:1px solid var(--accent-line);background:linear-gradient(180deg,var(--accent-soft),transparent 140px),var(--surface);border-radius:var(--r);padding:16px 18px;font-size:13.5px;line-height:1.6;margin-bottom:16px}
.diag-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.diag-h b{font-size:14px}
.diag p{margin:6px 0}
.diag ul{margin:4px 0 8px 18px}
.diag li{margin:2px 0}
.diag details{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.diag summary{cursor:pointer;font-weight:600;font-size:13px;list-style:none;display:flex;align-items:center;gap:6px}
.diag summary::-webkit-details-marker{display:none}
.diag summary::before{content:"›";display:inline-block;transition:transform .15s;color:var(--ink-3)}
.diag details[open] summary::before{transform:rotate(90deg)}
.diag-note{font-size:11.5px;color:var(--ink-3);margin-top:10px}
.acts-l{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* =====================================================================
   Équipe : messagerie avec les agents
===================================================================== */
.chat{display:grid;grid-template-columns:320px minmax(0,1fr);height:100%}
.chat-l{border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.chat-l-h{padding:18px 16px 10px}
.chat-l-h b{font-size:17px;font-weight:700;letter-spacing:-.015em}
.chat-l-h p{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.contact{display:flex;gap:12px;align-items:center;padding:11px 16px;cursor:pointer;transition:background .12s}
.contact:hover{background:var(--hover)}
.contact.on{background:var(--accent-soft)}
.contact .grow{flex:1;min-width:0}
.contact .l1{display:flex;align-items:baseline;gap:8px}
.contact .l1 b{flex:1;font-size:14px}
.contact .l1 time{font-size:11.5px;color:var(--ink-3)}
.contact .l2{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.contact .poste{font-size:11.5px;color:var(--ink-3)}
.chat-r{display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.chat-h{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.chat-h .grow{flex:1;min-width:0}
.chat-h b{font-size:15px}
.chat-h small{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-3)}
.fil{flex:1;overflow-y:auto;padding:24px 20px 12px;scroll-behavior:smooth}
.fil-in{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.presente{text-align:center;padding:10px 10px 18px}
.presente .av{margin:0 auto 10px}
.presente b{font-size:18px}
.presente p{color:var(--ink-2);font-size:13.5px;max-width:460px;margin:6px auto 0;line-height:1.55}
.presente .meta{display:flex;justify-content:center;gap:6px;margin-top:10px;flex-wrap:wrap}
.msg-r{display:flex;gap:10px;align-items:flex-end;animation:monte .2s ease}
.msg-r.moi{flex-direction:row-reverse}
.bulle{max-width:min(78%,620px);padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.55;word-break:break-word}
.msg-r.lui .bulle{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px;box-shadow:var(--shadow-1)}
.msg-r.moi .bulle{background:var(--accent);color:#fff;border-bottom-right-radius:6px;white-space:pre-wrap}
.msg-r.erreur .bulle{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.bulle p{margin:0 0 6px}.bulle p:last-child{margin:0}
.bulle ul,.bulle ol{margin:4px 0 6px 18px}
.bulle strong{font-weight:700}
.bulle a{color:var(--accent);text-decoration:underline}
.bulle code{font-family:var(--mono);font-size:12.5px;background:var(--surface-3);padding:1px 5px;border-radius:5px}
.msg-meta{font-size:11px;color:var(--ink-3);margin:2px 46px 0}
.msg-r.moi+.msg-meta{text-align:right;margin:2px 4px 0}
.faits{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0 46px}
.ctx{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:rgba(255,255,255,.18);border-radius:8px;padding:3px 8px;margin-bottom:6px}
.ecrit{display:flex;gap:4px;padding:14px 16px}
.ecrit i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);animation:ecrit 1.2s infinite}
.ecrit i:nth-child(2){animation-delay:.15s}.ecrit i:nth-child(3){animation-delay:.3s}
@keyframes ecrit{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.idees{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:4px}
.idees button{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;color:var(--ink-2);transition:border-color .15s,color .15s}
.idees button:hover{border-color:var(--accent);color:var(--accent)}
.compose{padding:12px 20px 18px;background:var(--bg)}
.compose-in{max-width:780px;margin:0 auto;background:var(--surface);border:1px solid var(--line-2);border-radius:18px;box-shadow:var(--shadow-2);padding:8px 8px 8px 14px;transition:border-color .15s}
.compose-in:focus-within{border-color:var(--accent)}
.compose-in .ctx-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:3px 4px 3px 9px;margin:2px 0 6px}
.compose-row{display:flex;align-items:flex-end;gap:8px}
.compose textarea{border:none;box-shadow:none;padding:8px 0;min-height:24px;max-height:200px;resize:none;background:transparent}
.compose .envoyer{width:38px;height:38px;border-radius:12px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.compose .envoyer:disabled{opacity:.4}
.compose .envoyer .ph-duotone{font-size:18px}
.compose-note{max-width:780px;margin:6px auto 0;font-size:11.5px;color:var(--ink-3);text-align:center}

/* =====================================================================
   Prospects : pipeline en colonnes
===================================================================== */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px;align-items:start}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;max-height:calc(100vh - 230px);min-height:160px}
.col.survol{border-color:var(--accent);background:var(--accent-soft)}
.col-h{display:flex;align-items:center;gap:8px;padding:12px 12px 8px}
.col-h b{flex:1;font-size:13px}
.col-h .n{font-size:12px;color:var(--ink-3);font-weight:600}
.col-b{overflow-y:auto;padding:4px 8px 10px;display:flex;flex-direction:column;gap:8px;min-height:60px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 12px;cursor:pointer;box-shadow:var(--shadow-1);transition:border-color .15s,transform .15s}
.pc:hover{border-color:var(--accent-line)}
.pc.drag{opacity:.5}
.pc b{display:block;font-size:13.5px}
.pc small{display:block;font-size:12px;color:var(--ink-3);margin-top:1px}
.pc .l3{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.pc p{font-size:12px;color:var(--ink-2);margin-top:6px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* =====================================================================
   Agenda : vue semaine
===================================================================== */
.semaine{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow-1)}
.sem-h{display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line)}
.sem-h div{padding:10px 6px;text-align:center;font-size:12px;color:var(--ink-3);border-left:1px solid var(--line)}
.sem-h div:first-child{border-left:none}
.sem-h b{display:block;font-size:18px;color:var(--ink);font-weight:700;letter-spacing:-.02em}
.sem-h .auj b{width:32px;height:32px;line-height:32px;border-radius:50%;margin:2px auto 0;background:var(--accent);color:#fff}
.sem-b{display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr));position:relative;max-height:calc(100vh - 260px);overflow-y:auto}
.sem-heures div{height:52px;font-size:11px;color:var(--ink-3);text-align:right;padding:0 8px;transform:translateY(-7px)}
.sem-jour{position:relative;border-left:1px solid var(--line)}
.sem-jour .creneau{height:52px;border-top:1px solid var(--line)}
.sem-jour .creneau:first-child{border-top:none}
.sem-jour .creneau:hover{background:var(--hover);cursor:pointer}
.sem-jour .dispo{position:absolute;left:0;right:0;background:var(--accent-soft);opacity:.45;pointer-events:none}
.sem-jour.auj{background:color-mix(in srgb,var(--accent) 3%,transparent)}
.ev{position:absolute;left:4px;right:4px;border-radius:8px;padding:5px 7px;font-size:11.5px;line-height:1.3;overflow:hidden;cursor:pointer;background:var(--accent);color:#fff;box-shadow:var(--shadow-1);border:1px solid rgba(255,255,255,.25)}
.ev b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.a_confirmer{background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn);border-left:4px solid var(--warn)}
.ev.fait{background:var(--surface-3);color:var(--ink-2);border-color:var(--line)}
.ev.annule{background:transparent;color:var(--ink-3);text-decoration:line-through;border:1px dashed var(--line-2);box-shadow:none}
.maintenant{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:3;pointer-events:none}

===================================================================== */
.chart{position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.chart .grid line{stroke:var(--grid);stroke-width:1;shape-rendering:crispEdges}
.chart .axe{stroke:var(--axis);stroke-width:1;shape-rendering:crispEdges}

.chart .lig{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .s1{stroke:var(--series-1)}.chart .s2{stroke:var(--series-2)}
.chart .a1{fill:var(--series-1);opacity:.1}
.chart .b1{fill:var(--series-1)}.chart .b2{fill:var(--series-2)}.chart .bh{fill:var(--series-hl)}

<script>
/* ================================================================
   Utilitaires
================================================================ */
var TOKEN = localStorage.getItem("paule_token") || "";
function $(s, r) { return (r || document).querySelector(s); }
function el(html) { var d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstChild; }
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({}, opts.headers);
  if (TOKEN) opts.headers["Authorization"] = "Bearer " + TOKEN;
  if (opts.body && !(opts.body instanceof FormData)) {
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(opts.body);
  }
  return fetch(path, opts).then(function (r) {
    if (r.status === 401 && path !== "/api/auth/login") { logout(); throw new Error("Session expirée — reconnectez-vous"); }
    return r.json().catch(function () { return {}; }).then(function (d) {
      if (!r.ok) throw new Error(d.erreur || "Erreur " + r.status);
      return d;
    });
  });
}

/* ================================================================
   Import de médias
   Avec Cloudinary configuré : le fichier part DIRECTEMENT du navigateur vers
   Cloudinary (pas de plafond de taille côté Vercel), le serveur ne fait que
   signer la demande puis enregistrer la fiche. Sinon : envoi classique vers
   /api/media, stocké en base.
================================================================ */
var MEDIA_CFG = null;
function mediaConfig() {
  if (MEDIA_CFG) return Promise.resolve(MEDIA_CFG);
  return api("/api/media/config").then(function (c) { MEDIA_CFG = c; return c; });
}

function mo(n) { return Math.round(n / 1024 / 1024) + " Mo"; }

/* POST multipart avec progression (fetch ne sait pas suivre l'upload) */
function postAvecProgression(url, formData, entetes, onProgress) {
  return new Promise(function (resolve, reject) {
    var xhr = new XMLHttpRequest();
    xhr.open("POST", url);
    Object.keys(entetes || {}).forEach(function (k) { xhr.setRequestHeader(k, entetes[k]); });
    xhr.upload.addEventListener("progress", function (e) {
      if (e.lengthComputable && onProgress) onProgress(Math.round((e.loaded / e.total) * 100));
    });
    xhr.addEventListener("load", function () {
      var d = {};
      try { d = JSON.parse(xhr.responseText); } catch (_) {}
      if (xhr.status >= 200 && xhr.status < 300) resolve(d);
      else reject(new Error(d.erreur || (d.error && d.error.message) || "Envoi impossible (erreur " + xhr.status + ")"));
    });
    xhr.addEventListener("error", function () { reject(new Error("Connexion interrompue pendant l'envoi")); });
    xhr.addEventListener("abort", function () { reject(new Error("Envoi annulé")); });
    xhr.send(formData);
  });
}

function uploadFile(file, onProgress) {
  return mediaConfig().then(function (cfg) {
    var estVideo = (file.type || "").indexOf("video/") === 0;
    var max = estVideo ? cfg.maxVideo : cfg.maxImage;
    if (cfg.typesAutorises && cfg.typesAutorises.indexOf(file.type) === -1) {
      throw new Error("Format non accepté (jpg, png, webp, gif, avif, mp4, webm, mov)");
    }
    if (file.size > max) {
      throw new Error("Fichier trop lourd : " + mo(file.size) + " (maximum " + mo(max) + ")");
    }

    // --- Repli : envoi vers notre serveur ---
    if (!cfg.cloudinary) {
      var fd = new FormData();
      fd.append("file", file);
      return postAvecProgression("/api/media", fd, { Authorization: "Bearer " + TOKEN }, onProgress)
        .then(function (d) { return d.url; });
    }

    // --- Cloudinary : signature → upload direct → enregistrement ---
    return api("/api/media/signature", { method: "POST", body: { type: file.type } }).then(function (s) {
      var fd2 = new FormData();
      fd2.append("file", file);
      fd2.append("api_key", s.apiKey);
      fd2.append("timestamp", s.timestamp);
      fd2.append("folder", s.folder);          // comptes en dossiers fixes
      fd2.append("asset_folder", s.assetFolder); // comptes en dossiers dynamiques
      fd2.append("signature", s.signature);
      return postAvecProgression(s.endpoint, fd2, null, onProgress);
    }).then(function (rep) {
      return api("/api/media/register", { method: "POST", body: rep });
    }).then(function (d) { return d.url; });
  });
}

/* ================================================================
   Connexion
================================================================ */
function logout() {
  TOKEN = ""; localStorage.removeItem("paule_token");
  $("#appView").hidden = true; $("#loginView").hidden = false;
}
$("#loginBtn").addEventListener("click", doLogin);
$("#pw").addEventListener("keydown", function (e) { if (e.key === "Enter") doLogin(); });
function doLogin() {
  $("#loginErr").textContent = "";
  api("/api/auth/login", { method: "POST", body: { password: $("#pw").value } })
    .then(function (d) {
      TOKEN = d.token; localStorage.setItem("paule_token", TOKEN);
      $("#pw").value = "";
      enter();
    })
    .catch(function (e) { $("#loginErr").textContent = e.message; });
}

/* ================================================================
   Vue liste (collections)
================================================================ */
function listView(name) {
  var s = SCHEMAS[name];
  api("/api/content/" + name).then(function (items) {
    var panel = $("#panel");
    panel.innerHTML = "";
    panel.appendChild(el('<div class="bar"><h2>' + esc(s.label) + '</h2><button class="btn primary" id="addBtn"><i class="ph-duotone ph-plus" aria-hidden="true"></i>Ajouter</button></div>'));
    panel.appendChild(el('<div class="hint">' + esc(s.aide) + " Les flèches changent l'ordre d'affichage sur le site.</div>"));
    $("#addBtn").addEventListener("click", function () {
      formView(name, {}, items.length ? Math.max.apply(null, items.map(function (i) { return i.ordre || 0; })) + 1 : 1);
    });
    if (!items.length) panel.appendChild(el('<div class="empty">Rien pour le moment — cliquez sur « + Ajouter ».</div>'));
    items.forEach(function (doc, idx) {
      var v = s.vignette(doc);
      var c = el(
        '<div class="card">' +
        (v ? '<img class="thumb" src="' + esc(v) + '" alt="">' : '<div class="thumb txt">' + esc((s.resume(doc) || "?").charAt(0)) + "</div>") +
        '<div class="cbody"><div class="ct">' + esc(s.resume(doc)) + (doc.epingle ? '<span class="badge">épinglé</span>' : "") +
        '</div><div class="cs">' + esc(s.sousTitre(doc)) + "</div></div>" +
        '<div class="acts">' +
        '<button class="icobtn up" title="Monter" aria-label="Monter"><i class="ph-duotone ph-arrow-up" aria-hidden="true"></i></button>' +
        '<button class="icobtn down" title="Descendre" aria-label="Descendre"><i class="ph-duotone ph-arrow-down" aria-hidden="true"></i></button>' +
        '<button class="icobtn edit" title="Modifier" aria-label="Modifier"><i class="ph-duotone ph-pencil-simple" aria-hidden="true"></i></button>' +
        '<button class="icobtn danger del" title="Supprimer" aria-label="Supprimer"><i class="ph-duotone ph-trash" aria-hidden="true"></i></button>' +
        "</div></div>"
      );
      $(".edit", c).addEventListener("click", function () { formView(name, doc); });
      $(".del", c).addEventListener("click", function () {
        if (!confirm("Supprimer « " + s.resume(doc) + " » ? Cette action est définitive.")) return;
        api("/api/content/" + name + "/" + doc._id, { method: "DELETE" }).then(function () { listView(name); });
      });
      $(".up", c).addEventListener("click", function () { swapOrder(name, items, idx, idx - 1); });
      $(".down", c).addEventListener("click", function () { swapOrder(name, items, idx, idx + 1); });
      panel.appendChild(c);
    });
  }).catch(showErr);
}

function swapOrder(name, items, a, b) {
  if (b < 0 || b >= items.length) return;
  var A = items[a], B = items[b];
  var oa = A.ordre != null ? A.ordre : a + 1;
  var ob = B.ordre != null ? B.ordre : b + 1;
  if (oa === ob) ob = oa + (b > a ? 1 : -1);
  Promise.all([
    api("/api/content/" + name + "/" + A._id, { method: "PUT", body: { ordre: ob } }),
    api("/api/content/" + name + "/" + B._id, { method: "PUT", body: { ordre: oa } }),
  ]).then(function () { listView(name); }).catch(showErr);
}

function showErr(e) {
  $("#panel").innerHTML = '<div class="empty">' + esc(e.message) + "</div>";
}

/* ================================================================
   Formulaires génériques
================================================================ */
function fieldInput(f, value) {
  var wrap = document.createElement("div");
  wrap.dataset.k = f.k;
  wrap.dataset.type = f.type;
  if (f.showIf) wrap.dataset.showif = f.showIf.join(",");
  var lab = "<label>" + esc(f.label) + (f.help ? ' <span class="help">— ' + esc(f.help) + "</span>" : "") + "</label>";

  if (f.type === "text") {
    wrap.innerHTML = lab + '<input type="text">';
    $("input", wrap).value = value || "";
  } else if (f.type === "date") {
    wrap.innerHTML = lab + '<input type="date" style="max-width:220px">';
    $("input", wrap).value = /^\d{4}-\d{2}-\d{2}$/.test(value || "") ? value
      : f.aujourdhui ? new Date(Date.now() + 3600000).toISOString().slice(0, 10) : "";
  } else if (f.type === "textarea") {
    wrap.innerHTML = lab + "<textarea></textarea>";
    $("textarea", wrap).value = value || "";
  } else if (f.type === "tags") {
    wrap.innerHTML = lab + '<input type="text">';
    $("input", wrap).value = (value || []).join(", ");
  } else if (f.type === "check") {
    wrap.innerHTML = '<label class="check"><input type="checkbox"> ' + esc(f.label) + "</label>";
    $("input", wrap).checked = !!value;
  } else if (f.type === "select") {
    wrap.innerHTML = lab + "<select>" + f.opts.map(function (o) {
      return '<option value="' + esc(o[0]) + '">' + esc(o[1]) + "</option>";
    }).join("") + "</select>";
    $("select", wrap).value = value != null ? value : f.opts[0][0];
  } else if (f.type === "media") {
    wrap.innerHTML = lab + '<div class="media-field"></div>';
    mediaWidget($(".media-field", wrap), value || "", f.accept);
  } else if (f.type === "medialist") {
    wrap.innerHTML = lab + '<div class="mlist"></div><button type="button" class="btn ghost sm" style="margin-top:8px">+ Ajouter une image</button>';
    var mlist = $(".mlist", wrap);
    (value || []).forEach(function (url) { addMediaRow(mlist, url, f.accept); });
    wrap.querySelector(":scope > button").addEventListener("click", function () { addMediaRow(mlist, "", f.accept); });
  } else if (f.type === "textlist") {
    wrap.innerHTML = lab + '<div class="tlist"></div><button type="button" class="btn ghost sm" style="margin-top:8px">+ Ajouter une ligne</button>';
    var tlist = $(".tlist", wrap);
    (value || []).forEach(function (t) { addTextRow(tlist, t); });
    wrap.querySelector(":scope > button").addEventListener("click", function () { addTextRow(tlist, ""); });
  } else if (f.type === "list") {
    wrap.innerHTML = lab + '<div class="olist"></div><button type="button" class="btn ghost sm" style="margin-top:8px">+ Ajouter</button>';
    var olist = $(".olist", wrap);
    (value || []).forEach(function (item) { addObjRow(olist, f.sub, item); });
    wrap.querySelector(":scope > button").addEventListener("click", function () { addObjRow(olist, f.sub, {}); });
  }
  return wrap;
}

function addTextRow(container, text) {
  var row = el('<div style="display:flex;gap:8px;margin-bottom:8px"><input type="text"><button type="button" class="icobtn danger" title="Retirer" aria-label="Retirer"><i class="ph-duotone ph-x" aria-hidden="true"></i></button></div>');
  $("input", row).value = text || "";
  $("button", row).addEventListener("click", function () { row.remove(); });
  container.appendChild(row);
}

function addMediaRow(container, url, accept) {
  var row = el('<div style="display:flex;gap:8px;margin-bottom:8px;align-items:center"><div class="media-field" style="flex:1"></div><button type="button" class="icobtn danger" title="Retirer" aria-label="Retirer"><i class="ph-duotone ph-x" aria-hidden="true"></i></button></div>');
  mediaWidget($(".media-field", row), url || "", accept);
  $("button", row).addEventListener("click", function () { row.remove(); });
  container.appendChild(row);
}

function addObjRow(container, sub, item) {
  var row = el('<div class="subrow"><button type="button" class="icobtn danger rm" title="Retirer" aria-label="Retirer"><i class="ph-duotone ph-x" aria-hidden="true"></i></button><div class="fields"></div></div>');
  var fields = $(".fields", row);
  sub.forEach(function (sf) { fields.appendChild(fieldInput(sf, item[sf.k])); });
  $(".rm", row).addEventListener("click", function () { row.remove(); });
  container.appendChild(row);
}

/* champ média : aperçu + import fichier + lien manuel */
function mediaWidget(box, url, accept) {
  box.dataset.url = url || "";
  function draw() {
    var u = box.dataset.url;
    var isVideo = u && (/\.(mp4|webm|mov)(\?|$)/i.test(u) || u.indexOf("/video/upload/") !== -1 ||
      ((accept || "").indexOf("video") === 0 && u.indexOf("/api/media/") === 0));
    box.innerHTML =
      (u ? (isVideo ? '<video src="' + esc(u) + '" muted></video>' : '<img src="' + esc(u) + '" alt="">')
         : '<div class="media-empty">+</div>') +
      '<div style="display:flex;flex-direction:column;gap:6px;flex:1;min-width:150px">' +
      '<button type="button" class="btn ghost sm pick">' + (u ? "Remplacer…" : "Importer un fichier…") + "</button>" +
      '<input type="text" class="lnk" placeholder="…ou collez un lien" style="font-size:12px;padding:7px 10px">' +
      '<span class="upmsg" style="font-size:11.5px;color:var(--ink-soft)"></span>' +
      "</div>" +
      '<input type="file" hidden accept="' + esc(accept || "image/*") + '">';
    $(".lnk", box).value = u || "";
    $(".lnk", box).addEventListener("change", function () { box.dataset.url = this.value.trim(); draw(); });
    $(".pick", box).addEventListener("click", function () { $("input[type=file]", box).click(); });
    $("input[type=file]", box).addEventListener("change", function () {
      var file = this.files[0];
      if (!file) return;
      var msg = $(".upmsg", box);
      var pick = $(".pick", box);
      msg.style.color = "var(--ink-soft)";
      msg.textContent = "Préparation…";
      pick.disabled = true;
      uploadFile(file, function (pct) {
        msg.textContent = "Envoi… " + pct + "%" + (pct === 100 ? " (finalisation)" : "");
      }).then(function (u2) {
        box.dataset.url = u2; draw();
      }).catch(function (e) {
        pick.disabled = false;
        msg.style.color = "var(--bad)";
        msg.textContent = e.message;
      });
    });
  }
  draw();
}

function collectFields(root) {
  var out = {};
  root.querySelectorAll(":scope > [data-k]").forEach(function (w) {
    var t = w.dataset.type, k = w.dataset.k;
    if (t === "text" || t === "date") out[k] = $("input", w).value.trim();
    else if (t === "textarea") out[k] = $("textarea", w).value;
    else if (t === "tags") out[k] = $("input", w).value.split(",").map(function (s) { return s.trim(); }).filter(Boolean);
    else if (t === "check") out[k] = $("input", w).checked;
    else if (t === "select") out[k] = $("select", w).value;
    else if (t === "media") out[k] = $(".media-field", w).dataset.url || "";
    else if (t === "medialist") {
      out[k] = [].map.call(w.querySelectorAll(".media-field"), function (m) { return m.dataset.url; }).filter(Boolean);
    } else if (t === "textlist") {
      out[k] = [].map.call(w.querySelectorAll(".tlist input"), function (i) { return i.value.trim(); }).filter(Boolean);
    } else if (t === "list") {
      out[k] = [].map.call(w.querySelectorAll(":scope > .olist > .subrow"), function (row) {
        return collectFields($(".fields", row));
      });
    }
  });
  return out;
}

function applyShowIf(form) {
  var typeSel = form.querySelector('[data-k="type"] select');
  var type = typeSel ? typeSel.value : null;
  form.querySelectorAll("[data-showif]").forEach(function (w) {
    w.style.display = !type || w.dataset.showif.split(",").indexOf(type) !== -1 ? "" : "none";
  });
}

function formView(name, doc, nextOrdre) {
  var s = SCHEMAS[name];
  var isNew = !doc._id;
  var panel = $("#panel");
  panel.innerHTML = "";
  panel.appendChild(el('<div class="bar"><h2>' + (isNew ? "Nouvelle " : "Modifier la ") + esc(s.labelUn) + '</h2><button class="btn" id="backBtn"><i class="ph-duotone ph-arrow-left" aria-hidden="true"></i>Retour</button></div>'));
  $("#backBtn").addEventListener("click", function () { listView(name); });

  var form = el('<div class="form"></div>');
  s.champs.forEach(function (f) { form.appendChild(fieldInput(f, doc[f.k])); });
  var foot = el(
    '<div class="formfoot"><button class="btn primary" id="saveBtn">Enregistrer</button>' +
    '<button class="btn ghost" id="cancelBtn">Annuler</button><span class="savemsg" id="saveMsg"></span></div>'
  );
  form.appendChild(foot);
  panel.appendChild(form);

  applyShowIf(form);
  var typeSel = form.querySelector('[data-k="type"] select');
  if (typeSel) typeSel.addEventListener("change", function () { applyShowIf(form); });

  $("#cancelBtn").addEventListener("click", function () { listView(name); });
  $("#saveBtn").addEventListener("click", function () {
    var btn = $("#saveBtn"); btn.disabled = true;
    $("#saveMsg").textContent = "";
    var body = collectFields(form);
    if (isNew) body.ordre = nextOrdre || 1;
    var req = isNew
      ? api("/api/content/" + name, { method: "POST", body: body })
      : api("/api/content/" + name + "/" + doc._id, { method: "PUT", body: body });
    req.then(function () { listView(name); })
      .catch(function (e) {
        btn.disabled = false;
        var m = $("#saveMsg"); m.textContent = e.message; m.className = "savemsg bad";
      });
  });
}

/* ================================================================
   Vue document unique (Profil / À propos)
================================================================ */
function singletonView(path, schema) {
  api(path).then(function (doc) {
    var panel = $("#panel");
    panel.innerHTML = "";
    panel.appendChild(el('<div class="bar"><h2>' + esc(schema.label) + "</h2></div>"));
    panel.appendChild(el('<div class="hint">' + esc(schema.aide) + "</div>"));
    var form = el('<div class="form"></div>');
    schema.champs.forEach(function (f) { form.appendChild(fieldInput(f, doc[f.k])); });
    var foot = el('<div class="formfoot"><button class="btn primary" id="saveBtn">Enregistrer</button><span class="savemsg" id="saveMsg"></span></div>');
    form.appendChild(foot);
    panel.appendChild(form);
    $("#saveBtn").addEventListener("click", function () {
      var btn = $("#saveBtn"); btn.disabled = true;
      api(path, { method: "PUT", body: collectFields(form) })
        .then(function () {
          btn.disabled = false;
          var m = $("#saveMsg"); m.textContent = "Enregistré ✓ — visible sur le site"; m.className = "savemsg ok";
          setTimeout(function () { m.textContent = ""; }, 4000);
        })
        .catch(function (e) {
          btn.disabled = false;
          var m = $("#saveMsg"); m.textContent = e.message; m.className = "savemsg bad";
        });
    });
  }).catch(showErr);
}


/* Numéro au format wa.me (chiffres seuls, avec indicatif). Un numéro gabonais
   saisi sans indicatif (« 076 21 51 55 ») reçoit le +241. */
function waNum(tel) {
  var raw = String(tel || "").trim();
  var d = raw.replace(/\D/g, "");
  if (!d) return "";
  if (raw.charAt(0) === "+") return d.length >= 8 ? d : "";
  if (d.indexOf("00") === 0) return d.slice(2);
  if (d.length <= 9) return "241" + d;
  return d;
}

function dateCourte(iso) {
  if (!iso) return "";
  var d = new Date(iso), maintenant = new Date();
  var ecart = (maintenant - d) / 1000;
  if (ecart < 60) return "à l'instant";
  if (ecart < 3600) return "il y a " + Math.floor(ecart / 60) + " min";
  if (ecart < 86400) return "il y a " + Math.floor(ecart / 3600) + " h";
  return d.toLocaleString("fr-FR", { dateStyle: "medium", timeStyle: "short" });
}

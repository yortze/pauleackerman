<style>
/* =====================================================================
   Jetons
===================================================================== */
:root{
  --bg:#EAECF0;
  --surface:#FFFFFF;
  --elev:#FFFFFF;
  --soft:#E9EBF0;
  --hover:rgba(14,17,22,.05);
  --chip:#DFE3EA;
  --ink:#0E1116;
  --ink-2:#5A6173;
  --line:rgba(14,17,22,.12);
  --line-2:rgba(14,17,22,.06);
  --blue:#2D6AE0;
  --blue-h:#2459c4;
  --link:#2D6AE0;
  --like:#E0455A;
  --wa:#1A8D4B;
  --ok:#1FA86A;
  --ring:linear-gradient(45deg,#141A2A 0%,#2D6AE0 55%,#7FA8F5 100%);
  --shade:rgba(10,14,24,.72);
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:'Instrument Serif',Georgia,serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --sb:244px;
  --photo:url(/media/asset-01-90d3c5eb78.jpg);
}
html[data-theme="dark"]{
  --bg:#0B0E15;
  --surface:#151A26;
  --elev:#151A26;
  --soft:#1C2231;
  --hover:rgba(232,234,242,.06);
  --chip:#232A3B;
  --ink:#E8EAF2;
  --ink-2:#A3ABC0;
  --line:rgba(232,234,242,.13);
  --line-2:rgba(232,234,242,.07);
  --link:#6E9BF5;
  --shade:rgba(0,0,0,.8);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.35;
  -webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit;text-decoration:none}
img,video{display:block;max-width:100%}
input,textarea,select{font:inherit;color:inherit}
.ic{line-height:1;flex:0 0 auto}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}

/* =====================================================================
   Écran de chargement d'origine : emblème qui se dessine + polyèdre 3D
===================================================================== */
/* ============ LOADING SCREEN — EMBLEM BUILD ============ */
.splash{
  position:fixed;inset:0;z-index:1000;
  background:radial-gradient(ellipse 80% 70% at 50% 44%,#141A2A 0%,#0A0E18 70%,#06080F 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:0;transition:opacity .7s ease,visibility .7s;
  overflow:hidden;
}
.splash.gone{opacity:0;visibility:hidden;pointer-events:none}
.splash::before{
  content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.04) 1px,transparent 0);
  background-size:5px 5px;
}
/* sweeping light beam */
.splash::after{
  content:'';position:absolute;width:160%;height:60px;left:-30%;top:46%;
  background:linear-gradient(90deg,transparent,rgba(45,106,224,.16),transparent);
  transform:rotate(-8deg);
  animation:beam 2.6s ease-in-out .3s;
}
@keyframes beam{0%{transform:rotate(-8deg) translateX(-70%);opacity:0}
  30%{opacity:1}70%{opacity:1}100%{transform:rotate(-8deg) translateX(70%);opacity:0}}

.emblem{
  position:relative;width:188px;height:188px;
  display:flex;align-items:center;justify-content:center;
}
.emblem svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}

/* the SVG-drawn ring + crest strokes */
.em-stroke{
  fill:none;stroke:#4D86F2;stroke-linecap:round;
  stroke-dasharray:var(--len);stroke-dashoffset:var(--len);
}
.em-ring{stroke:url(#igGrad);stroke-width:3;animation:draw 1.1s cubic-bezier(.6,0,.3,1) .2s forwards}
.em-ring-2{stroke-width:1;stroke:rgba(45,106,224,.55);
  animation:draw 1s cubic-bezier(.6,0,.3,1) .45s forwards}
.em-tick{stroke-width:2;stroke:#fff;
  animation:draw .5s ease .95s forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* rotating accent ring */
.em-orbit{
  position:absolute;inset:-14px;border-radius:50%;
  border:1px dashed rgba(45,106,224,.3);
  opacity:0;animation:orbitIn .6s ease 1.1s forwards, orbitSpin 14s linear 1.1s infinite;
}
@keyframes orbitIn{to{opacity:1}}
@keyframes orbitSpin{to{transform:rotate(360deg)}}

/* the initials block that stamps in */
.em-initials{
  position:relative;z-index:3;
  font-family:var(--serif);font-style:italic;
  font-size:62px;color:#fff;letter-spacing:-.02em;
  display:flex;align-items:baseline;
  opacity:0;animation:stamp .55s cubic-bezier(.3,1.5,.5,1) .7s forwards;
}
.em-initials .amp{
  font-size:30px;color:#4D86F2;margin:0 1px;
  transform:translateY(-4px);
}
@keyframes stamp{
  0%{opacity:0;transform:scale(2.4)}
  60%{opacity:1}
  78%{transform:scale(.9)}
  100%{opacity:1;transform:scale(1)}
}

/* glow burst behind initials on stamp */
.em-burst{
  position:absolute;width:90px;height:90px;border-radius:50%;
  background:radial-gradient(circle,rgba(45,106,224,.65),transparent 70%);
  z-index:2;opacity:0;
  animation:burst .8s ease .7s forwards;
}
@keyframes burst{0%{opacity:0;transform:scale(.3)}
  40%{opacity:.9}100%{opacity:0;transform:scale(2.1)}}

/* name — letter by letter */
.em-name{
  margin-top:30px;display:flex;gap:.02em;
  font-family:var(--serif);font-size:30px;color:#fff;
  letter-spacing:.04em;
}
.em-name .ch{
  display:inline-block;opacity:0;transform:translateY(14px);
  animation:chIn .5s cubic-bezier(.2,.8,.2,1) forwards;
}
.em-name .sp{width:.34em}
@keyframes chIn{to{opacity:1;transform:none}}

.em-rule{
  width:0;height:1px;background:rgba(45,106,224,.55);
  margin-top:14px;
  animation:ruleOut .7s cubic-bezier(.5,0,.2,1) 2s forwards;
}
@keyframes ruleOut{to{width:188px}}

.em-tagline{
  margin-top:12px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.32em;
  text-transform:uppercase;color:rgba(255,255,255,.42);
  opacity:0;animation:fadeUp .6s ease 2.25s forwards;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* whole crest settles with a final breath */
.emblem,.em-namewrap{will-change:transform}
.splash-inner{
  display:flex;flex-direction:column;align-items:center;
  animation:settle .9s ease 2.7s forwards;
  position:relative;z-index:1002;
}
#bg3d{position:fixed;inset:0;z-index:1001;pointer-events:none;transition:opacity 1s ease}
@keyframes settle{0%{transform:scale(1)}35%{transform:scale(1.045)}100%{transform:scale(1)}}
.splash.quick .em-orbit,.splash.quick .em-burst{display:none}

/* =====================================================================
   Barre latérale (ordinateur) / barres haut + bas (mobile)
===================================================================== */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sb);border-right:1px solid var(--line);
  background:var(--surface);padding:8px 12px 20px;display:flex;flex-direction:column;z-index:50}
.sb-logo{display:flex;align-items:center;height:73px;padding:24px 12px 16px;margin-bottom:4px}
.wordmark{font-family:var(--serif);font-style:italic;font-size:27px;letter-spacing:-.01em;line-height:1;white-space:nowrap}
.sb-mono{display:none;width:30px;height:30px;border-radius:9px;background:var(--ring);color:#fff;
  font-family:var(--serif);font-style:italic;font-size:14px;align-items:center;justify-content:center}
.sb-items{display:flex;flex-direction:column;gap:2px;flex:1}
.sb-item{display:flex;align-items:center;gap:16px;padding:12px;border-radius:8px;font-size:16px;
  text-align:left;width:100%;position:relative;transition:background .15s}
.sb-item:hover{background:var(--hover)}
.sb-item .ic{font-size:26px;transition:transform .15s}
.sb-item:hover .ic,.sb-item:hover .sb-av{transform:scale(1.06)}
.sb-item.on{font-weight:700}
.sb-item.on .ic{color:var(--ink)}
.sb-av{width:26px;height:26px;border-radius:50%;background:#141A2A center/cover no-repeat;flex:0 0 auto;
  background-image:var(--photo);transition:transform .15s}
.sb-item.on .sb-av{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--ink)}
.sb-dot{position:absolute;left:30px;top:9px;width:9px;height:9px;border-radius:50%;background:var(--like);
  border:2px solid var(--surface)}

.mtop,.mbar{display:none}

.main{margin-left:var(--sb);min-height:100vh}
.view{display:none}
.view.on{display:block}

/* =====================================================================
   Accueil : stories + fil + colonne de droite
===================================================================== */
.home{display:flex;justify-content:center;gap:64px;padding:22px 20px 60px}
.feed{width:100%;max-width:470px}
.right{width:320px;padding-top:36px;flex:0 0 auto}

.stories{display:flex;gap:14px;overflow-x:auto;padding:8px 2px 14px;margin-bottom:12px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story-b{display:flex;flex-direction:column;align-items:center;gap:6px;width:72px;flex:0 0 auto}
.ring{width:66px;height:66px;border-radius:50%;padding:2.5px;background:var(--ring)}
.ring.seen{background:var(--line)}
.ring-in{width:100%;height:100%;border-radius:50%;border:3px solid var(--bg);background:var(--soft) center/cover no-repeat;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.ring-in .ic{font-size:26px;color:var(--ink)}
.story-b span{font-size:12px;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* --- publication --- */
.post{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;padding-bottom:12px;margin-bottom:18px;scroll-margin-top:70px}
.post .p-head,.post .acts,.post .cap,.post .add-c{padding-left:14px;padding-right:14px}
.post .acts{padding-left:16px}
.post .media{border-radius:0;border-left:0;border-right:0}
.post.flash{animation:flash 2.2s ease}
@keyframes flash{0%,45%{background:rgba(45,106,224,.10)}100%{background:transparent}}
.p-head{display:flex;align-items:center;gap:10px;padding:8px 4px 12px}
.av{width:32px;height:32px;border-radius:50%;background:#141A2A var(--photo) center/cover no-repeat;flex:0 0 auto}
.av.ringed{box-shadow:0 0 0 2px var(--bg),0 0 0 4px #2D6AE0}
.p-id{flex:1;min-width:0;line-height:1.2}
.p-nm{font-weight:600;font-size:14px;display:flex;align-items:center;gap:4px}
.p-nm .dt{font-weight:400;color:var(--ink-2)}
.p-loc{font-size:12px;color:var(--ink);margin-top:1px}
.verif{width:13px;height:13px;border-radius:50%;background:var(--blue);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.verif svg{width:8px;height:8px;stroke:#fff;stroke-width:3;fill:none}
.p-more{padding:6px;border-radius:50%}
.p-more .ic{font-size:22px}
.pin{font-size:11px;color:var(--ink-2);display:flex;align-items:center;gap:3px}

.media{position:relative;border-radius:4px;overflow:hidden;background:var(--soft);border:1px solid var(--line-2)}
.media img.single{width:100%;max-height:600px;object-fit:contain;background:var(--soft)}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;aspect-ratio:4/5}
.track::-webkit-scrollbar{display:none}
.track>*{flex:0 0 100%;scroll-snap-align:center;width:100%;height:100%;object-fit:contain;background:var(--soft)}
.car-btn{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;
  background:rgba(255,255,255,.85);color:#111;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,.18);z-index:3}
.car-btn.prev{left:10px}.car-btn.next{right:10px}
.car-btn .ic{font-size:16px}
.car-n{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:600;
  border-radius:12px;padding:4px 9px;z-index:3}
.dots{display:flex;justify-content:center;gap:4px;padding-top:12px;height:18px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--blue)}
.media video{width:100%;max-height:600px;background:#000}
.media iframe{width:100%;border:0;display:block;background:#000}
.mute{position:absolute;right:12px;bottom:12px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.7);
  color:#fff;display:flex;align-items:center;justify-content:center;z-index:3}
.mute .ic{font-size:15px}
.big-heart{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:4;opacity:0}
.big-heart .ic{font-size:110px;color:#fff;filter:drop-shadow(0 4px 18px rgba(0,0,0,.35))}
.big-heart.go{animation:bh .9s ease}
@keyframes bh{0%{opacity:0;transform:scale(.4)}15%{opacity:1;transform:scale(1.15)}30%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(1.05)}}

/* publications « texte » ou « partage » : visuel carré façon citation */
.quote-tile{aspect-ratio:1;display:flex;flex-direction:column;justify-content:center;padding:44px 38px;
  background:var(--ring);color:#fff}
.quote-tile .q{font-family:var(--serif);font-style:italic;font-size:30px;line-height:1.18}
.quote-tile .qs{margin-top:18px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.quote-tile.cert{background:linear-gradient(160deg,#10172A,#1D3A78)}
.quote-tile .qbadge{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.14);display:flex;
  align-items:center;justify-content:center;font-family:var(--serif);font-style:italic;font-size:22px;margin-bottom:18px}

.acts{display:flex;align-items:center;gap:4px;padding:6px 0 2px}
.act{padding:8px;margin-left:-8px;margin-right:6px;border-radius:50%;display:flex}
.act .ic{font-size:25px;transition:transform .12s}
.act:hover .ic{color:var(--ink-2)}
.act:active .ic{transform:scale(.88)}
.act.liked .ic{color:var(--like)}
.act.saved .ic{color:var(--ink)}
.act.liked .ic,.act.saved .ic{animation:pop .35s ease}
@keyframes pop{50%{transform:scale(1.2)}}
.acts .sp{flex:1}
.cap{font-size:14px;line-height:1.4;padding:4px 0}
.cap b{font-weight:600}
.cap .nm{font-weight:600;margin-right:5px}
.tags{color:var(--link)}
.cap .tags{display:block;margin-top:2px}
.when{font-size:11px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.02em;padding-top:6px}
.add-c{display:flex;align-items:center;gap:8px;padding-top:8px;color:var(--ink-2);font-size:14px;width:100%;text-align:left}
.add-c .ic{font-size:18px;margin-left:auto}

/* carrousel « suggestions » (marques accompagnées) dans le fil mobile */
.sugg-strip{display:none;border-bottom:1px solid var(--line);padding:4px 0 18px;margin-bottom:12px}
.sugg-strip h4{font-size:15px;font-weight:600;padding:6px 0 12px;display:flex;justify-content:space-between}
.sugg-strip h4 button{color:var(--blue);font-size:14px;font-weight:600}
.sugg-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.sugg-row::-webkit-scrollbar{display:none}
.sugg-card{flex:0 0 160px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:18px 12px 12px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:4px}
.sugg-card .ini{width:64px;height:64px;border-radius:50%;background:var(--chip);display:flex;align-items:center;
  justify-content:center;font-family:var(--serif);font-style:italic;font-size:28px;margin-bottom:6px}
.sugg-card b{font-size:13.5px}
.sugg-card small{font-size:12px;color:var(--ink-2);line-height:1.3;min-height:31px}
.sugg-card .btn{margin-top:8px;width:100%}

/* colonne de droite */
.me-row{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.me-row .av{width:44px;height:44px}
.me-row .p-id b{font-weight:600;font-size:14px;display:flex;align-items:center;gap:4px}
.me-row .p-id small{color:var(--ink-2);font-size:14px}
.link-btn{color:var(--blue);font-weight:600;font-size:12px}
.link-btn:hover{color:var(--link)}
.r-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.r-h b{color:var(--ink-2);font-weight:600;font-size:14px}
.r-h button{font-size:12px;font-weight:600}
.r-row{display:flex;align-items:center;gap:12px;padding:8px 0}
.r-row .ini{width:44px;height:44px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-style:italic;font-size:20px;flex:0 0 auto}
.r-row .p-id b{font-size:14px;font-weight:600;display:flex;gap:6px;align-items:center}
.r-row .p-id small{font-size:12px;color:var(--ink-2);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:10px;font-weight:600;color:var(--blue);background:rgba(45,106,224,.1);border-radius:5px;padding:1px 6px}
.r-foot{margin-top:28px;font-size:12px;color:var(--ink-2);line-height:1.7}
.r-foot a,.r-foot button{color:var(--ink-2);font-size:12px}
.r-foot a:hover,.r-foot button:hover{text-decoration:underline}
.r-foot .copy{margin-top:14px;text-transform:uppercase}

/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 16px;border-radius:8px;
  font-weight:600;font-size:14px;background:var(--chip);color:var(--ink);transition:background .15s,filter .15s;white-space:nowrap}
.btn:hover{filter:brightness(.95)}
html[data-theme="dark"] .btn:hover{filter:brightness(1.25)}
.btn.blue{background:var(--blue);color:#fff}
.btn.blue:hover{background:var(--blue-h);filter:none}
.btn.wa{background:var(--wa);color:#fff}
.btn .ic{font-size:18px}
.btn.ico{padding:0 9px}

/* =====================================================================
   Profil
===================================================================== */
.profile{max-width:935px;margin:0 auto;padding:30px 20px 60px}
.pf-head{display:grid;grid-template-columns:290px 1fr;align-items:start;margin-bottom:44px}
.pf-av{justify-self:center;width:150px;height:150px;border-radius:50%;padding:4px;background:var(--ring);cursor:pointer}
.pf-av div{width:100%;height:100%;border-radius:50%;border:4px solid var(--bg);background:#141A2A var(--photo) center/cover no-repeat}
.pf-info{min-width:0}
.pf-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.pf-handle{font-size:20px;font-weight:400;display:flex;align-items:center;gap:6px;margin-right:10px}
.pf-handle .verif{width:18px;height:18px}
.pf-handle .verif svg{width:10px;height:10px}
.pf-btns{display:flex;gap:8px;flex-wrap:wrap}
.pf-stats{display:flex;gap:40px;margin-bottom:20px;font-size:16px}
.pf-stats b{font-weight:600}
.pf-name{font-weight:600;font-size:14px}
.pf-cat{color:var(--ink-2);font-size:14px}
.pf-bio{white-space:pre-line;margin-top:2px}
.pf-bio .serif{font-family:var(--serif);font-style:italic;font-size:16px}
.pf-links{margin-top:4px;display:flex;flex-direction:column;gap:2px}
.pf-links a{color:var(--link);font-weight:600;display:inline-flex;align-items:center;gap:5px}
.pf-links .ic{font-size:15px}
.pf-loc{color:var(--ink-2);display:flex;align-items:center;gap:4px;margin-top:2px}
.pf-dispo{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:13px;color:var(--ink-2)}
.pf-dispo i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(31,168,106,.18)}
.pf-mbtns,.pf-mmore{display:none!important}

.hls{display:flex;gap:40px;overflow-x:auto;padding:0 0 44px 40px;scrollbar-width:none}
.hls::-webkit-scrollbar{display:none}
.hls .story-b{width:87px}
.hls .ring{width:87px;height:87px;background:var(--line);padding:1.5px}
.hls .ring-in{border-width:3.5px;background-color:var(--soft)}
.hls .story-b span{font-size:12px;font-weight:600;max-width:87px}

.tabs{display:flex;justify-content:center;gap:60px;border-top:1px solid var(--line)}
.tab{display:flex;align-items:center;gap:6px;height:52px;font-size:12px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2);border-top:1px solid transparent;margin-top:-1px}
.tab .ic{font-size:14px}
.tab.on{color:var(--ink);border-top-color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tile{position:relative;aspect-ratio:1;background:var(--soft) center/cover no-repeat;overflow:hidden;cursor:pointer}
.tile>img,.tile>video{width:100%;height:100%;object-fit:cover}
.tile .t-ic{position:absolute;top:8px;right:8px;color:#fff;font-size:20px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
.tile .t-ov{position:absolute;inset:0;background:rgba(0,0,0,.35);opacity:0;transition:opacity .15s;display:flex;
  align-items:flex-end;padding:12px;color:#fff;font-weight:600;font-size:13px;line-height:1.3}
.tile:hover .t-ov{opacity:1}
.tile.txt{display:flex;align-items:center;justify-content:center;padding:16px;background:var(--ring);color:#fff;
  font-family:var(--serif);font-style:italic;font-size:18px;text-align:center;line-height:1.2}
.tile.txt.cert{background:linear-gradient(160deg,#10172A,#1D3A78)}
.grid.reels .tile{aspect-ratio:9/16}
.grid.guides{grid-template-columns:repeat(2,1fr);gap:16px}
.guide{cursor:pointer}
.guide .gimg{aspect-ratio:4/3;border-radius:8px;background:var(--soft) center/cover no-repeat;border:1px solid var(--line-2)}
.guide b{display:block;margin-top:8px;font-size:14px;font-weight:600}
.guide small{color:var(--ink-2);font-size:12px}
.empty{padding:60px 20px;text-align:center;color:var(--ink-2)}

/* =====================================================================
   Explorer
===================================================================== */
.explore{max-width:975px;margin:0 auto;padding:24px 20px 60px}
.explore .grid{grid-auto-flow:dense}
.explore .tile.tall{grid-row:span 2;aspect-ratio:auto}

/* =====================================================================
   Reels
===================================================================== */
.reels-v{height:100vh;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}
.reels-v::-webkit-scrollbar{display:none}
.reel{height:100vh;scroll-snap-align:start;display:flex;align-items:center;justify-content:center;gap:16px;padding:20px 0}
.reel-box{position:relative;height:min(calc(100vh - 40px),860px);aspect-ratio:9/16;border-radius:8px;overflow:hidden;background:#000}
.reel-box video,.reel-box iframe{width:100%;height:100%;object-fit:cover;border:0}
.reel-info{position:absolute;left:0;right:0;bottom:0;padding:60px 16px 18px;color:#fff;
  background:linear-gradient(transparent,rgba(0,0,0,.6));pointer-events:none}
.reel-info .who{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:8px;pointer-events:auto}
.reel-info .who .av{width:32px;height:32px}
.reel-info .btn{height:28px;padding:0 10px;font-size:13px;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.6)}
.reel-acts{display:flex;flex-direction:column;gap:18px;align-self:flex-end;padding-bottom:20px}
.reel-acts .act{flex-direction:column;align-items:center;gap:3px;margin:0;font-size:12px;border-radius:8px}
.reel-acts .act .ic{font-size:27px}
.reel .mute{bottom:auto;top:14px}

/* =====================================================================
   Messages (Direct)
===================================================================== */
body.dm .sidebar{--sb:72px}
body.dm .main{margin-left:72px}
.dm-wrap{display:grid;grid-template-columns:350px 1fr;height:100vh;background:var(--surface)}
.dm-list{border-right:1px solid var(--line);display:flex;flex-direction:column}
.dm-list-h{padding:36px 24px 12px;font-size:20px;font-weight:700}
.dm-list-s{padding:12px 24px 10px;font-weight:700;font-size:16px;display:flex;justify-content:space-between}
.dm-list-s span{color:var(--ink-2);font-weight:600;font-size:14px}
.convo{display:flex;align-items:center;gap:12px;padding:8px 24px;background:var(--hover)}
.convo .av{width:56px;height:56px}
.convo .p-id small{color:var(--ink-2);font-size:12px;display:block;margin-top:2px}
.dm-main{display:flex;flex-direction:column;min-width:0;height:100vh}
.dm-h{display:flex;align-items:center;gap:12px;padding:0 16px;height:75px;border-bottom:1px solid var(--line);flex:0 0 auto}
.dm-h .av{width:44px;height:44px}
.dm-h .p-id small{font-size:12px;color:var(--ink-2)}
.dm-h .ic{padding:8px;border-radius:50%;display:flex}
.dm-h .ic .ic{font-size:25px}
.dm-back{display:none}
.dm-body{flex:1;overflow-y:auto;padding:20px 16px 12px;display:flex;flex-direction:column;gap:4px}
.dm-card{text-align:center;padding:12px 0 28px}
.dm-card .av{width:96px;height:96px;margin:0 auto 12px}
.dm-card b{font-size:20px;display:flex;align-items:center;justify-content:center;gap:6px}
.dm-card small{display:block;color:var(--ink-2);margin:4px 0 14px}
.bub{max-width:min(75%,460px);padding:8px 13px;border-radius:22px;font-size:15px;line-height:1.35;white-space:pre-wrap;word-wrap:break-word;
  animation:bin .25s ease}
@keyframes bin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bub.them{align-self:flex-start;background:var(--chip);border-bottom-left-radius:6px}
.bub.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:6px}
.bub.err{background:rgba(237,73,86,.12);color:var(--like)}
.bub-row{display:flex;align-items:flex-end;gap:8px}
.bub-row .av{width:28px;height:28px}
.bub-row .bub{max-width:100%}
.bub-row .spacer{display:block;width:28px;flex:0 0 auto}
.typing{display:flex;gap:4px;padding:13px 14px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-2);animation:td 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes td{0%,60%,100%{opacity:.35}30%{opacity:1}}
.quick{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;margin:6px 0 4px;animation:bin .25s ease}
.quick button,.quick a{border:1px solid var(--blue);color:var(--blue);border-radius:18px;padding:7px 14px;font-size:14px;font-weight:600;
  background:var(--surface);display:inline-flex;align-items:center;gap:6px}
.quick button:hover,.quick a:hover{background:rgba(45,106,224,.08)}
.quick .wa{border-color:var(--wa);color:var(--wa)}
.ts{text-align:center;font-size:12px;color:var(--ink-2);margin:10px 0 6px}
.dm-foot{padding:12px 16px 16px;flex:0 0 auto}
.composer{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:22px;padding:4px 6px 4px 14px;min-height:44px}
.composer .ic{font-size:24px}
.composer input{flex:1;border:none;background:transparent;outline:none;font-size:15px;padding:6px 0;min-width:0}
.composer .send{color:var(--blue);font-weight:600;padding:6px 10px}
.composer .send:disabled{opacity:.4;cursor:default}

/* =====================================================================
   Superpositions : publication ouverte, stories, feuille, à propos
===================================================================== */
.ov{position:fixed;inset:0;z-index:200;background:var(--shade);display:flex;align-items:center;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.ov-x{position:fixed;top:14px;right:18px;color:#fff;z-index:3;padding:6px}
.ov-x .ic{font-size:30px}

.pm{background:var(--elev);display:grid;grid-template-columns:minmax(0,1fr) 405px;width:min(1180px,calc(100vw - 128px));
  height:min(92vh,880px);border-radius:4px;overflow:hidden}
.pm-media{background:#000;display:flex;align-items:center;justify-content:center;min-width:0;position:relative}
.pm-media .media{border:0;border-radius:0;background:#000;width:100%;height:100%;display:flex;align-items:center}
.pm-media .media img.single,.pm-media .media video{max-height:none;height:100%;width:100%;object-fit:contain;background:#000}
.pm-media .track{aspect-ratio:auto;height:100%;width:100%}
.pm-media .track>*{background:#000}
.pm-media .dots{position:absolute;bottom:14px;left:0;right:0;padding:0}
.pm-media .quote-tile{width:100%;aspect-ratio:auto;height:100%}
.pm-media iframe{height:100%}
.pm-side{display:flex;flex-direction:column;min-width:0;border-left:1px solid var(--line-2)}
.pm-side .p-head{padding:14px 16px;border-bottom:1px solid var(--line-2)}
.pm-coms{flex:1;overflow-y:auto;padding:16px}
.com{display:flex;gap:14px;margin-bottom:18px}
.com .av{flex:0 0 auto}
.com .cap{padding:0}
.com .when{padding-top:8px;text-transform:none;letter-spacing:0;font-size:12px}
.com .ini{width:32px;height:32px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-style:italic;font-size:16px;flex:0 0 auto;background-size:cover;background-position:center}
.pm-bot{border-top:1px solid var(--line-2);padding:6px 16px 0}
.pm-bot .when{padding:2px 0 12px}
.pm-add{border-top:1px solid var(--line-2);display:flex;align-items:center;gap:10px;padding:6px 16px}
.pm-add .ic{font-size:24px}
.pm-add input{flex:1;border:none;background:transparent;outline:none;padding:10px 0;font-size:14px}
.pm-add button{color:var(--blue);font-weight:600}
.pm-add button:disabled{opacity:.4}
.pm-nav{position:fixed;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.9);
  color:#111;display:flex;align-items:center;justify-content:center;z-index:3}
.pm-nav.prev{left:24px}.pm-nav.next{right:24px}

/* stories */
.st{position:fixed;inset:0;z-index:210;background:#0A0E18;display:flex;align-items:center;justify-content:center;animation:fade .2s}
.st-box{position:relative;height:min(100vh,860px);aspect-ratio:9/16;max-width:100vw;border-radius:8px;overflow:hidden;background:#111;
  user-select:none;-webkit-user-select:none}
.st-bars{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:3px;z-index:5}
.st-bars i{flex:1;height:2px;background:rgba(255,255,255,.35);border-radius:2px;overflow:hidden}
.st-bars i b{display:block;height:100%;width:0;background:#fff}
.st-head{position:absolute;top:22px;left:12px;right:12px;display:flex;align-items:center;gap:8px;color:#fff;z-index:5;font-size:14px}
.st-head .av{width:32px;height:32px}
.st-head .dt{opacity:.7}
.st-head .sp{flex:1}
.st-head button{color:#fff;padding:4px;display:flex}
.st-head .ic{font-size:24px}
.st-slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:84px 28px 96px;color:#fff;
  background:var(--ring) center/cover no-repeat}
.st-slide.dark{background:linear-gradient(165deg,#10172A,#1D3A78)}
.st-slide.photo::before{content:'';position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.05) 35%,rgba(0,0,0,.7))}
.st-slide>*{position:relative}
.st-k{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.8;margin-bottom:12px}
.st-t{font-family:var(--serif);font-style:italic;font-size:38px;line-height:1.05;margin-bottom:12px}
.st-p{font-size:16px;line-height:1.45;opacity:.92}
.st-ul{list-style:none;margin:18px 0;display:flex;flex-direction:column;gap:10px;font-size:15px}
.st-ul li{display:flex;gap:9px;align-items:flex-start}
.st-ul .ic{font-size:19px;margin-top:1px}
.st-price{display:inline-block;background:#fff;color:#111;font-weight:700;border-radius:10px;padding:8px 12px;font-size:16px;align-self:flex-start}
.st-price small{font-weight:500;color:#555;margin-left:4px}
.st-photo-slide{justify-content:flex-end}
.st-cta{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);z-index:6;background:#fff;color:#111;font-weight:700;
  border-radius:10px;padding:10px 16px;display:flex;align-items:center;gap:7px;box-shadow:0 6px 20px rgba(0,0,0,.25);white-space:nowrap}
.st-cta .ic{font-size:18px;color:var(--blue)}
.st-cta.wa .ic{color:var(--wa)}
.st-ctas{position:absolute;left:24px;right:24px;bottom:86px;z-index:6;display:flex;flex-direction:column;gap:8px}
.st-ctas .st-cta{position:static;transform:none;justify-content:center}
.st-tap{position:absolute;top:70px;bottom:80px;z-index:4}
.st-tap.l{left:0;width:30%}.st-tap.r{right:0;width:70%}
.st-reply{position:absolute;left:12px;right:12px;bottom:16px;z-index:6;display:flex;gap:10px;align-items:center}
.st-reply input{flex:1;background:transparent;border:1px solid rgba(255,255,255,.6);border-radius:22px;padding:11px 16px;color:#fff;outline:none;font-size:14px}
.st-reply input::placeholder{color:rgba(255,255,255,.85)}
.st-reply button{color:#fff;display:flex}
.st-reply .ic{font-size:26px}
.st-nav{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.85);
  color:#111;display:flex;align-items:center;justify-content:center}
.st-nav.prev{left:calc(50% - min(100vh,860px)*9/32 - 48px)}
.st-nav.next{right:calc(50% - min(100vh,860px)*9/32 - 48px)}
.st-x{position:fixed;top:14px;right:18px;color:#fff;padding:6px}
.st-x .ic{font-size:30px}

/* feuille d'actions (Contacter, Plus…) */
.sheet{background:var(--elev);border-radius:12px;width:min(400px,calc(100vw - 40px));overflow:hidden;animation:sin .2s ease}
@keyframes sin{from{transform:scale(1.08);opacity:0}to{transform:none;opacity:1}}
.sheet h3{font-size:16px;font-weight:700;text-align:center;padding:16px;border-bottom:1px solid var(--line)}
.sheet p.sub{font-size:13px;color:var(--ink-2);text-align:center;padding:0 24px 14px;margin-top:-6px}
.sheet .row{display:flex;align-items:center;gap:12px;width:100%;padding:14px 20px;border-top:1px solid var(--line);font-size:14px;text-align:left}
.sheet h3+.row{border-top:none}
.sheet .row:hover{background:var(--hover)}
.sheet .row .ic{font-size:24px}
.sheet .row small{display:block;color:var(--ink-2);font-size:12px}
.sheet .row.cancel{justify-content:center}
.sheet .row.wa .ic{color:var(--wa)}
.sheet .row.blue .ic{color:var(--blue)}

/* à propos de ce compte */
.about{background:var(--elev);border-radius:12px;width:min(560px,calc(100vw - 32px));max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.about-h{display:flex;align-items:center;justify-content:center;position:relative;padding:14px;border-bottom:1px solid var(--line);font-weight:700;font-size:16px}
.about-h button{position:absolute;right:10px;padding:4px;display:flex}
.about-h .ic{font-size:24px}
.about-b{overflow-y:auto;padding:24px 24px 30px}
.about-top{text-align:center;margin-bottom:24px}
.about-top .av{width:78px;height:78px;margin:0 auto 10px}
.about-top b{font-size:18px}
.about-top p{color:var(--ink-2);margin-top:6px;line-height:1.5}
.about-top .serif{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--ink)}
.ab-sec{border-top:1px solid var(--line-2);padding:18px 0}
.ab-sec h4{font-size:16px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.ab-sec h4 .ic{font-size:22px;color:var(--blue)}
.ab-sec p{color:var(--ink-2);line-height:1.5;margin-bottom:8px}
.ab-row{display:flex;gap:14px;padding:7px 0;line-height:1.4}
.ab-row .y{color:var(--ink-2);font-size:13px;flex:0 0 42px;padding-top:1px}
.ab-row span{color:var(--ink-2)}
.ab-row b{font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills span{background:var(--chip);border-radius:8px;padding:6px 10px;font-size:13px}
.pills span.dash{background:transparent;border:1px dashed var(--line);color:var(--ink-2)}
.ab-links a{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line-2)}
.ab-links a span{color:var(--ink-2)}

/* panneau notifications */
.notif{position:fixed;top:0;bottom:0;left:72px;width:397px;background:var(--surface);border-right:1px solid var(--line);z-index:45;
  border-radius:0 16px 16px 0;box-shadow:4px 0 24px rgba(0,0,0,.15);display:flex;flex-direction:column;animation:nin .25s ease}
@keyframes nin{from{transform:translateX(-30px);opacity:0}to{transform:none;opacity:1}}
.notif-h{padding:24px 24px 14px;font-size:24px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.notif-h button{display:flex;padding:4px}
.notif-b{overflow-y:auto;flex:1;padding-bottom:20px}
.notif-s{padding:12px 24px 6px;font-weight:700;font-size:16px}
.nrow{display:flex;align-items:center;gap:12px;padding:8px 24px;width:100%;text-align:left;font-size:14px;line-height:1.35}
.nrow:hover{background:var(--hover)}
.nrow .av{width:44px;height:44px}
.nrow .t{flex:1;min-width:0}
.nrow .t span{color:var(--ink-2)}
.nrow .th{width:44px;height:44px;border-radius:4px;background:var(--soft) center/cover no-repeat;flex:0 0 auto}
.nrow .btn{flex:0 0 auto}
body.notif-open .sidebar{--sb:72px}

/* =====================================================================
   Tailles d'écran
===================================================================== */
@media (max-width:1263px){
  :root{--sb:72px}
  .sidebar{padding:8px 12px 20px;align-items:center}
  .sb-logo{padding:24px 0 16px;justify-content:center}
  .wordmark.sb-w{display:none}
  .sb-mono{display:flex}
  .sb-item span:not(.sb-av){display:none}
  .sb-item{justify-content:center;width:48px}
}
body.dm .wordmark.sb-w,body.notif-open .wordmark.sb-w{display:none}
body.dm .sb-mono,body.notif-open .sb-mono{display:flex}
body.dm .sb-item span:not(.sb-av),body.notif-open .sb-item span:not(.sb-av){display:none}
body.dm .sb-item,body.notif-open .sb-item{justify-content:center;width:48px}
body.dm .sidebar,body.notif-open .sidebar{width:72px;align-items:center}
body.dm .sb-logo,body.notif-open .sb-logo{padding:24px 0 16px;justify-content:center}

@media (max-width:1159px){
  .right{display:none}
  .sugg-strip{display:block}
}
@media (max-width:767px){
  .sidebar{display:none}
  .main,body.dm .main{margin-left:0;padding-top:52px;padding-bottom:50px}
  .mtop{display:flex;position:fixed;top:0;left:0;right:0;height:52px;z-index:50;background:var(--surface);
    border-bottom:1px solid var(--line);align-items:center;justify-content:space-between;padding:0 6px 0 16px}
  .mtop .wordmark{font-size:25px}
  .mtop-r{display:flex}
  .mtop-r button{padding:9px;display:flex;position:relative}
  .mtop-r .ic{font-size:25px}
  .mtop-r .sb-dot{left:auto;right:6px;top:6px}
  .mbar{display:flex;position:fixed;bottom:0;left:0;right:0;height:50px;z-index:50;background:var(--surface);
    border-top:1px solid var(--line);justify-content:space-around;align-items:center;padding-bottom:env(safe-area-inset-bottom)}
  .mbar button{padding:10px 14px;display:flex}
  .mbar .ic{font-size:26px}
  .mbar button.on .ic{color:var(--ink)}
  .mbar .sb-av{width:26px;height:26px}
  .mbar button.on .sb-av{box-shadow:0 0 0 1.5px var(--surface),0 0 0 3px var(--ink)}

  .home{padding:0 0 30px;gap:0}
  .stories{padding:10px 10px 12px;margin:0;border-bottom:1px solid var(--line)}
  .post{border-radius:0;border-left:0;border-right:0;margin-bottom:8px;padding-bottom:10px}
  .p-head,.acts,.cap,.when,.add-c,.dots{padding-left:12px;padding-right:12px}
  .acts{padding-left:14px}
  .media{border-radius:0;border-left:0;border-right:0}
  .sugg-strip{padding:4px 12px 18px}

  .profile{padding:16px 0 30px}
  .pf-head{grid-template-columns:auto 1fr;gap:0 24px;padding:0 16px;margin-bottom:14px;align-items:center}
  .pf-av{width:86px;height:86px;padding:3px}
  .pf-av div{border-width:3px}
  .pf-top{grid-column:1/-1;order:-1;margin-bottom:14px}
  .pf-top .pf-btns{display:none}
  .pf-stats{gap:0;justify-content:space-around;margin:0;font-size:14px;text-align:center}
  .pf-stats div{display:flex;flex-direction:column}
  .pf-desc{grid-column:1/-1;margin-top:12px}
  .pf-info{display:contents}
  .pf-mmore{display:inline-flex!important}
  .pf-mbtns{display:flex!important;gap:6px;padding:0 16px;margin-bottom:16px}
  .pf-mbtns .btn{flex:1;padding:0 6px;font-size:13px;gap:5px;min-width:0}
  .pf-mbtns .btn .ic{font-size:16px}
  .pf-mbtns .btn.ico{flex:0 0 auto}
  .hls{gap:16px;padding:0 16px 18px}
  .hls .story-b{width:64px}
  .hls .ring{width:64px;height:64px}
  .hls .story-b span{max-width:64px}
  .tabs{gap:0;justify-content:space-around}
  .tab span{display:none}
  .tab .ic{font-size:24px}
  .tab{border-top:none;height:44px;border-bottom:1px solid transparent}
  .tab.on{border-bottom-color:var(--ink);color:var(--ink)}
  .grid{gap:2px}
  .grid.guides{gap:12px;padding:12px}
  .explore{padding:2px 0 20px}

  .reels-v{height:calc(100vh - 102px)}
  .reel{height:calc(100vh - 102px);padding:0;gap:0;position:relative}
  .reel-box{height:100%;width:100%;aspect-ratio:auto;border-radius:0}
  .reel-acts{position:absolute;right:8px;bottom:70px;color:#fff;padding:0}
  .reel-acts .act:hover .ic{color:#fff}

  body.dm .mtop,body.dm .mbar{display:none}
  body.dm .main{padding:0}
  .dm-wrap{grid-template-columns:1fr;height:100vh;height:100dvh}
  .dm-list{display:none}
  .dm-main{height:100vh;height:100dvh}
  .dm-h{height:60px;padding:0 8px}
  .dm-back{display:flex}

  .pm{grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto auto;width:100vw;height:100vh;height:100dvh;border-radius:0}
  .pm-side{display:contents}
  .pm-side .p-head{order:-2;border-bottom:none}
  .pm-media{order:-1;max-height:70vh}
  .pm-media .media img.single,.pm-media .media video{height:auto;max-height:70vh}
  .pm-media .track{aspect-ratio:4/5;height:auto}
  .pm-media .quote-tile{aspect-ratio:1;height:auto}
  .pm-coms{order:1;padding:12px}
  .pm-bot{order:0}
  .pm-add{order:2;padding-bottom:max(6px,env(safe-area-inset-bottom))}
  .pm-nav{display:none}
  .ov-x{top:6px;right:6px;color:var(--ink);background:var(--surface);border-radius:50%;z-index:4}
  .ov-x .ic{font-size:24px}
  .ov:has(.pm){background:var(--elev)}

  .st-box{height:100%;width:100%;border-radius:0;aspect-ratio:auto}
  .st-nav,.st-x{display:none}

  .notif{left:0;width:100%;border-radius:0;top:52px;bottom:50px;box-shadow:none;border:none}
  .notif-h{padding:16px}
}
</style>
</head>
<body>

<div class="splash" id="splash">
  <div class="splash-inner">
    <div class="emblem">
      <div class="em-orbit"></div>
      <div class="em-burst"></div>
      <svg viewBox="0 0 188 188" aria-hidden="true">
        <defs>
          <linearGradient id="igGrad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#4D86F2"/>
            <stop offset="50%" stop-color="#2D6AE0"/>
            <stop offset="100%" stop-color="#141A2A"/>
          </linearGradient>
        </defs>
        <circle class="em-stroke em-ring" cx="94" cy="94" r="78" style="--len:490"/>
        <circle class="em-stroke em-ring-2" cx="94" cy="94" r="66" style="--len:415"/>
        <line class="em-stroke em-tick" x1="94" y1="6" x2="94" y2="20" style="--len:14"/>
        <line class="em-stroke em-tick" x1="94" y1="168" x2="94" y2="182" style="--len:14"/>
        <line class="em-stroke em-tick" x1="6" y1="94" x2="20" y2="94" style="--len:14"/>
        <line class="em-stroke em-tick" x1="168" y1="94" x2="182" y2="94" style="--len:14"/>
      </svg>
      <div class="em-initials">P<span class="amp">·</span>A</div>
    </div>
    <div class="em-name" id="emName" aria-label="Paule Ackerman"></div>
    <div class="em-rule"></div>
    <div class="em-tagline">Studio social &amp; motion · Libreville</div>
  </div>
</div>

<!-- ============ BARRE LATÉRALE (ordinateur) ============ -->
<nav class="sidebar" aria-label="Navigation principale">
  <button class="sb-logo" data-go="home" aria-label="Accueil">
    <span class="wordmark sb-w">paule.ackerman</span><span class="sb-mono">P·A</span>
  </button>
  <div class="sb-items">
    <button class="sb-item" data-go="home"><i class="ic ph ph-house" aria-hidden="true"></i><span>Accueil</span></button>
    <button class="sb-item" data-go="explore"><i class="ic ph ph-compass" aria-hidden="true"></i><span>Explorer</span></button>
    <button class="sb-item" data-go="reels"><i class="ic ph ph-film-slate" aria-hidden="true"></i><span>Reels</span></button>
    <button class="sb-item" data-go="messages"><i class="ic ph ph-paper-plane-tilt" aria-hidden="true"></i><span>Messages</span><b class="sb-dot js-dot"></b></button>
    <button class="sb-item" data-act="notifs"><i class="ic ph ph-heart" aria-hidden="true"></i><span>Notifications</span></button>
    <button class="sb-item" data-act="dm"><i class="ic ph ph-plus-square" aria-hidden="true"></i><span>Lancer un projet</span></button>
    <button class="sb-item" data-go="profile"><span class="sb-av" aria-hidden="true"></span><span>Profil</span></button>
  </div>
  <button class="sb-item" data-act="more"><i class="ic ph ph-list" aria-hidden="true"></i><span>Plus</span></button>
</nav>

<!-- ============ BARRE DU HAUT (mobile) ============ -->
<header class="mtop">
  <button class="wordmark" data-go="home" aria-label="Accueil">paule.ackerman</button>
  <div class="mtop-r">
    <button data-act="notifs" aria-label="Notifications"><i class="ic ph ph-heart" aria-hidden="true"></i></button>
    <button data-go="messages" aria-label="Messages"><i class="ic ph ph-paper-plane-tilt" aria-hidden="true"></i><b class="sb-dot js-dot"></b></button>
  </div>
</header>

<main class="main" id="main">

  <!-- ============ ACCUEIL ============ -->
  <section class="view" data-view="home">
    <div class="home">
      <div class="feed">
        <div class="stories" id="homeStories" aria-label="Stories"></div>
        <div id="feedPosts"></div>
      </div>
      <aside class="right" id="rightCol" aria-label="Infos"></aside>
    </div>
  </section>

  <!-- ============ EXPLORER ============ -->
  <section class="view" data-view="explore">
    <div class="explore"><div class="grid" id="exploreGrid"></div></div>
  </section>

  <!-- ============ REELS ============ -->
  <section class="view" data-view="reels">
    <div class="reels-v" id="reelsList"></div>
  </section>

  <!-- ============ MESSAGES ============ -->
  <section class="view" data-view="messages">
    <div class="dm-wrap">
      <div class="dm-list">
        <div class="dm-list-h js-handle">paule_ackerman</div>
        <div class="dm-list-s">Messages <span>Demandes</span></div>
        <div class="convo">
          <div class="av"></div>
          <div class="p-id"><b class="js-name">Paule Ackerman</b><small class="js-dispo">Active maintenant</small></div>
        </div>
      </div>
      <div class="dm-main">
        <div class="dm-h">
          <button class="ic dm-back" data-go="home" aria-label="Retour"><i class="ic ph ph-caret-left" aria-hidden="true"></i></button>
          <div class="av"></div>
          <div class="p-id"><b class="p-nm"><span class="js-name">Paule Ackerman</span></b><small class="js-dispo">Active maintenant</small></div>
          <span style="flex:1"></span>
          <a class="ic" data-wa href="#" target="_blank" rel="noopener" aria-label="Continuer sur WhatsApp" title="Continuer sur WhatsApp"><i class="ic ph ph-whatsapp-logo" aria-hidden="true"></i></a>
          <button class="ic" data-act="contact" aria-label="Autres moyens de contact" title="Autres moyens de contact"><i class="ic ph ph-info" aria-hidden="true"></i></button>
        </div>
        <div class="dm-body" id="dmBody" aria-live="polite"></div>
        <form class="dm-foot" id="dmForm" autocomplete="on" novalidate>
          <input id="dmSite" name="website" type="text" tabindex="-1" autocomplete="off" class="sr" aria-hidden="true">
          <div class="composer">
            <i class="ic ph ph-smiley" aria-hidden="true"></i>
            <input id="dmInput" type="text" placeholder="Votre message…" maxlength="4000" aria-label="Votre message">
            <button class="send" id="dmSend" type="submit" disabled>Envoyer</button>
          </div>
        </form>
      </div>
    </div>
  </section>

  <!-- ============ PROFIL ============ -->
  <section class="view" data-view="profile">
    <div class="profile" id="profileView"></div>
  </section>

</main>

<!-- ============ BARRE DU BAS (mobile) ============ -->
<nav class="mbar" aria-label="Navigation">
  <button data-go="home" aria-label="Accueil"><i class="ic ph ph-house" aria-hidden="true"></i></button>
  <button data-go="explore" aria-label="Explorer"><i class="ic ph ph-compass" aria-hidden="true"></i></button>
  <button data-act="dm" aria-label="Lancer un projet"><i class="ic ph ph-plus-square" aria-hidden="true"></i></button>
  <button data-go="reels" aria-label="Reels"><i class="ic ph ph-film-slate" aria-hidden="true"></i></button>
  <button data-go="profile" aria-label="Profil"><span class="sb-av" aria-hidden="true"></span></button>
</nav>

<div id="layers"></div>

<script src="/app.js?v=2026-11-20"></script>
</body>
